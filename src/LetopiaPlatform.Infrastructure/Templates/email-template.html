<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{Subject}}</title>
        <style>
            body { margin: 0; padding: 0; background-color: #f4f4f7; font-family: 'Segoe UI', Arial, sans-serif; }
            .wrapper { width: 100%; background-color: #f4f4f7; padding: 40px 0; }
            .card { max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
            .header { background: linear-gradient(135deg, #6366f1, #8b5cf6); padding: 32px 40px; text-align: center; }
            .header img { height: 36px; }
            .header h1 { color: #ffffff; font-size: 22px; margin: 16px 0 0; }
            .body-content { padding: 32px 40px; color: #374151; font-size: 15px; line-height: 1.7; }
            .btn { display: inline-block; margin: 24px 0; padding: 12px 32px; background: #6366f1; color: #ffffff !important; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 15px; }
            .footer { padding: 24px 40px; text-align: center; font-size: 12px; color: #9ca3af; border-top: 1px solid #f3f4f6; }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="card">
                <div class="header">
                    <h1>{{Title}}</h1>
                </div>
                <div class="body-content">
                    {{Body}}
                    {{ButtonBlock}}
                </div>
                <div class="footer">
                    &copy; {{Year}} Letopia. All rights reserved.
                </div>
            </div>
        </div>
    </body>
</html>
