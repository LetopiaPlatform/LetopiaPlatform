<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{Subject}}</title>
        <style>
            body { margin: 0; padding: 0; background-color: #f5f5f5; font-family: 'Segoe UI', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
            .wrapper { width: 100%; background-color: #f5f5f5; padding: 40px 0; }
            .card { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
            .logo-section { padding: 32px 40px 16px; text-align: left; }
            .logo-section img { height: 28px; vertical-align: middle; margin-right: 8px; }
            .logo-text { font-size: 22px; font-weight: 700; color: #6366f1; letter-spacing: -0.5px; vertical-align: middle; }
            .illustration { text-align: center; padding: 8px 40px 0; }
            .illustration img { max-width: 280px; height: auto; }
            .title-section { padding: 24px 40px 0; text-align: center; }
            .title-section h1 { font-size: 22px; font-weight: 700; color: #1f2937; margin: 0; line-height: 1.3; }
            .body-content { padding: 24px 40px 32px; color: #4b5563; font-size: 15px; line-height: 1.7; }
            .body-content p { margin: 0 0 16px; }
            .greeting { font-weight: 600; color: #1f2937; margin-bottom: 16px !important; }
            .code-box { text-align: center; margin: 24px 0; }
            .code-value { display: inline-block; padding: 16px 40px; background: #f3f4f6; border-radius: 12px; font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #6366f1; font-family: 'Courier New', monospace; }
            .btn { display: inline-block; margin: 8px 0 16px; padding: 14px 36px; background: #6366f1; color: #ffffff !important; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 15px; }
            .btn:hover { background: #4f46e5; }
            .btn-wrapper { text-align: center; margin: 8px 0; }
            .help-text { font-size: 13px; color: #9ca3af; margin-top: 24px !important; }
            .help-text a { color: #6366f1; text-decoration: none; }
            .divider { border: none; border-top: 1px solid #e5e7eb; margin: 0; }
            .tagline { padding: 20px 40px 0; text-align: center; font-size: 11px; font-weight: 600; color: #6366f1; letter-spacing: 2px; text-transform: uppercase; }
            .footer { padding: 12px 40px 24px; text-align: center; font-size: 12px; color: #9ca3af; }
            .footer a { color: #6366f1; text-decoration: none; }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="card">
                <div class="logo-section">
                    <img src="{{IconUrl}}" alt="LeTopia" /><span class="logo-text">LeTopia</span>
                </div>
                {{IllustrationBlock}}
                <div class="title-section">
                    <h1>{{Title}}</h1>
                </div>
                <div class="body-content">
                    {{GreetingBlock}}
                    {{Body}}
                    {{CodeBlock}}
                    {{AfterCodeBody}}
                    {{ButtonBlock}}
                    <p class="help-text">Need help? Contact us at <a href="mailto:support@letopia.tech">support@letopia.tech</a></p>
                </div>
                <hr class="divider" />
                <div class="tagline">Where Anyone Can Learn Anything</div>
                <div class="footer">
                    &copy; {{Year}} LeTopia. All Rights Reserved.
                </div>
            </div>
        </div>
    </body>
</html>
